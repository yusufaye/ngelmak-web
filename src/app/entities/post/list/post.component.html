                <a class="flex items-center cq84g cb8zv ch4gv cuvgf" href="#0">

  <div class="flex-1 pl-4">
    <form class="flex items-center max-w-md">
      <div class="relative w-full">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
            fill="none" viewBox="0 0 20 20">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
          </svg>
        </div>
        <input type="search" #query
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 outline-none"
          placeholder="Rechercher une publication..." required />
      </div>
      <button type="button" (click)="search(query.value)"
        class="inline-flex items-center py-2.5 px-3 ms-2 text-sm font-medium text-white bg-blue-700 rounded-lg border border-blue-700 hover:bg-blue-800 focus:ring-2 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
        Rechercher
      </button>
    </form>


    <div class="flex flex-col divide-y divide-gray-200 dark:divide-gray-700">
      @if (posts()?.length > 0) {
      <article *ngFor="let post of posts()" class="py-8">
        <!-- Header -->
        <div class="flex flex-col gap-2">
          <div class="flex items-center">
            <a class="inline-flex mr-4" [routerLink]="['/profile', post.account.name]">
              <img class="rounded-full max-w-none w-12 h-12" src="https://randomuser.me/api/portraits/men/35.jpg" />
            </a>
            <div class="flex flex-col">
              <!-- Name and following button -->
              <div class="flex space-x-2">
                <a class="inline-block text-sm font-medium text-gray-900 dark:text-white"
                  [routerLink]="['/account', post.account.name ]">{{post.account.name }}</a>
                <svg class="w-5 h-5 text-blue-800" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                  height="24" fill="currentColor" viewBox="0 0 24 24">
                  <path fill-rule="evenodd"
                    d="M12 2c-.791 0-1.55.314-2.11.874l-.893.893a.985.985 0 0 1-.696.288H7.04A2.984 2.984 0 0 0 4.055 7.04v1.262a.986.986 0 0 1-.288.696l-.893.893a2.984 2.984 0 0 0 0 4.22l.893.893a.985.985 0 0 1 .288.696v1.262a2.984 2.984 0 0 0 2.984 2.984h1.262c.261 0 .512.104.696.288l.893.893a2.984 2.984 0 0 0 4.22 0l.893-.893a.985.985 0 0 1 .696-.288h1.262a2.984 2.984 0 0 0 2.984-2.984V15.7c0-.261.104-.512.288-.696l.893-.893a2.984 2.984 0 0 0 0-4.22l-.893-.893a.985.985 0 0 1-.288-.696V7.04a2.984 2.984 0 0 0-2.984-2.984h-1.262a.985.985 0 0 1-.696-.288l-.893-.893A2.984 2.984 0 0 0 12 2Zm3.683 7.73a1 1 0 1 0-1.414-1.413l-4.253 4.253-1.277-1.277a1 1 0 0 0-1.415 1.414l1.985 1.984a1 1 0 0 0 1.414 0l4.96-4.96Z"
                    clip-rule="evenodd" />
                </svg>
                <button type="button"
                  class="inline-flex items-center text-sm font-medium text-gray-900 dark:text-white">
                  Following
                </button>
              </div>
              <!-- Keywords and publish at -->
              <div class="inline-flex items-center space-x-1">
                <div class="inline-flex items-center">
                  <span *ngFor="let keyword of post.keywords.split(',')"
                    class="bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 text-xs font-medium me-2 px-2.5 py-0.5 rounded">{{keyword}}</span>
                </div>
                <span class="w-1 h-1 bg-gray-600 dark:bg-slate-400 rounded-full mr-1"></span>
                <div class="text-gray-500 dark:text-gray-400">
                  {{post.at | duration}}
                </div>
              </div>
            </div>
          </div>
          <!-- Post title -->
          <a [routerLink]="['/post', post.id, 'view' ]" class="text-2xl font-extrabold text-gray-900 dark:text-white">
            {{post.title}}
          </a>
        </div>
        <!-- Replay to a post content -->
        <div>
        </div>
        <!-- Actual post's content -->
        <div class="px-2">
          <div class="text-black dark:text-gray-200" [innerHTML]="post.content"></div>
        </div>
        <!-- Actions -->
        <div class="flex justify-between pt-5">
          <div
            class="inline-flex items-center space-x-2 divide-x divide-gray-800 dark:divide-gray-600 border border-gray-800 dark:border-gray-600 rounded-full">
            <div class="inline-flex items-center space-x-2 text-gray-600 dark:text-gray-400 p-2">
              <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 10.5h.01m-4.01 0h.01M8 10.5h.01M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-6.6a1 1 0 0 0-.69.275l-2.866 2.723A.5.5 0 0 1 8 18.635V17a1 1 0 0 0-1-1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
              </svg>
              Commentaires
              <span class="w-1 h-1 bg-gray-600 dark:bg-slate-400 rounded-full mr-1"></span>
              <div>{{post.comments?.length}}</div>
            </div>
            <div class="p-2">
              <svg
                class="w-6 h-6 text-gray-600 dark:text-gray-400 hover:text-blue-500 dark:hover:text-blue-200 cursor-pointer"
                aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z" />
              </svg>
            </div>
          </div>
          <a class="inline-flex items-center font-medium text-blue-600 dark:text-blue-500"
            [routerLink]="['/post', post.id, 'view']">
            Read more
            <svg class="w-4 h-4 ml-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd"
                d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                clip-rule="evenodd"></path>
            </svg>
          </a>
        </div>
      </article>
      }
      @if (isLoading()) {
      <article *ngFor="let item of [1, 2, 3]" class="py-8 animate-pulse">
        <div class="flex flex-col gap-2">
          <div class="flex items-center">
            <a class="inline-flex mr-4" href="#">
              <div class="rounded-full max-w-none w-12 h-12">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="text-gray-200 dark:text-gray-700 size-6">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                </svg>
              </div>
            </a>
            <div class="flex flex-col">
              <div class="flex items-center space-x-2">
                <span class="w-28 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
                <span class="w-4 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
                <span class="w-10 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              </div>
              <div class="inline-flex items-center space-x-1">
                <div class="inline-flex items-center">
                  <span class="w-14 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
                  <span class="w-20 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
                </div>
                <span class="w-1 h-1 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
                <span class="w-16 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              </div>
            </div>
          </div>
          <div class="inline-flex">
            <span class="w-52 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
            <span class="w-24 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
            <span class="w-16 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
          </div>
        </div>
        <div>
        </div>
        <div class="px-2">
          <div class="flex flex-col space-y-1">
            <span class="w-52 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
            <span class="w-4/5 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
            <span class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
            <span class="w-3/5 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
            <span class="w-2/6 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
            <span class="w-2/3 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          </div>
        </div>
        <div class="flex justify-between pt-5">
          <div class="inline-flex items-center space-x-2">
            <div class="inline-flex items-center space-x-2 text-gray-200 dark:text-gray-700 p-2">
              <span class="w-4 h-4 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
              <span class="w-24 h-4 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
              <span class="w-1 h-1 bg-gray-200 dark:bg-gray-700 rounded-full mr-1"></span>
            </div>
            <div class="p-2">
              <span class="w-4 h-4 bg-gray-200 dark:bg-gray-700 block rounded-full"></span>
            </div>
          </div>
          <a class="inline-flex items-center font-medium text-gray-200 dark:text-gray-700">
            <span class="w-24 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
            <span class="w-4 h-4 bg-gray-200 dark:bg-gray-700 block rounded-full"></span>
          </a>
        </div>
      </article>
      }
    </div>

    <!-- Pagination -->
    <div *ngIf="posts()?.length > 0" class="inline-flex items-center gap-2">
      <button type="button" (click)="navigateToPage(page-1)" [disabled]="!hasPrevious()"
        class="inline-flex items-center text-gray-900 hover:text-white border border-gray-800 hover:bg-gray-900 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2 text-center me-2 mb-2 dark:border-gray-600 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-800">
        <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
          viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 12h14M5 12l4-4m-4 4 4 4" />
        </svg>
        Page précédente
      </button>

      <button type="button" (click)="navigateToPage(page+1)" [disabled]="!hasNext()"
        class="inline-flex items-center text-gray-900 hover:text-white border border-gray-800 hover:bg-gray-900 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2 text-center me-2 mb-2 dark:border-gray-600 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-800">
        Page suivante
        <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
          viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 12H5m14 0-4 4m4-4-4-4" />
        </svg>
      </button>
    </div>
  </div>
</div>
