<h2 mat-dialog-title>
  <div class="inline-flex items-center">
    Attribution de privilège
    <svg class="w-7 h-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
      stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.25-8.25-3.286Zm0 13.036h.008v.008H12v-.008Z" />
    </svg>
  </div>
</h2>


<mat-dialog-content class="w-full">
  <form class="flex flex-col gap-4 py-2" [formGroup]="privilegeForm">
    <mat-form-field class="w-full">
      <mat-label>Privilège</mat-label>
      <mat-select required name="privilege" formControlName="privilege">
        @for (privilege of privileges; track privilege.name) {
        <mat-option [value]="privilege">{{privilege.name}}</mat-option>
        }
      </mat-select>
      <mat-error *ngIf="privilegeForm.get('privilege')!.dirty &&
      privilegeForm.get('privilege')?.errors?.['required']">Le privilège est requis.</mat-error>
    </mat-form-field>

    <mat-form-field class="w-full min-h-[50px]">
      <mat-label>Commentaire</mat-label>
      <textarea matInput required formControlName="comment" placeholder="Pourquoi accorder ce privilège ?"></textarea>
      <mat-error *ngIf="privilegeForm.get('comment')!.dirty &&
      privilegeForm.get('comment')?.errors?.['required']">Votre commentaire est requis.</mat-error>
      <mat-error *ngIf="privilegeForm.get('comment')!.dirty &&
      privilegeForm.get('comment')?.errors?.['minlength']">
        Écrivez au moins 10 caractères.
      </mat-error>
      <mat-error *ngIf="privilegeForm.get('comment')!.dirty &&
      privilegeForm.get('comment')?.errors?.['maxlength']">Écrivez au plus 500 caractères.
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <div class="w-full inline-flex justify-center rounded-md shadow-sm" role="group">
    <button type="button" mat-dialog-close cdkFocusInitial
      class="inline-flex items-center px-4 py-2 text-md font-medium text-gray-900 dark:text-white bg-white border border-gray-200 rounded-s-lg hover:bg-gray-100 hover:text-red-700 dark:hover:text-red-700 focus:z-10 focus:ring-2 focus:ring-red-700 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700 dark:focus:ring-red-500">
      <svg class="w-5 h-5 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
        viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="m15 9-6 6m0-6 6 6m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
      Annuler
    </button>
    <button type="button" (click)="save()" [disabled]="privilegeForm.invalid || isSaving()"
      class="inline-flex items-center px-4 py-2 text-md font-medium text-gray-900 bg-white border border-gray-200 rounded-e-lg hover:bg-gray-100 hover:text-blue-700 dark:hover:text-blue-700 focus:z-10 focus:ring-2 focus:ring-blue-700 focus:text-blue-700 dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:hover:bg-gray-700 dark:focus:ring-blue-500 disabled:text-gray-900 disabled:cursor-not-allowed">
      <svg class="w-5 h-5 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
        viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8.5 11.5 11 14l4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
      Accorder
    </button>
  </div>
</mat-dialog-actions>
